name: Sanity readings
description: >-
  Fail unless the committed .sanity/ readings are complete, current to the code at
  HEAD, and taken by one agent and model. Runs no model and needs no credentials.
branding:
  icon: check-circle
  color: orange

# A gate over readings developers have already taken and committed. It never reads:
# `sanity check` spawns coding agents, which would mean model credentials in CI, and
# readings belong to whoever is about to ship the code they describe.
#
# The repo has to be checked out first. History is not needed — `verify` compares each
# reading against the body it was taken from, not against a commit.
#
# It runs the headless `sanity` — every verb, no window — which Sanity releases for Linux,
# macOS and Windows from 0.33.0. v1 ran the Linux AppImage, and still works for older versions.

inputs:
  version:
    description: >-
      Sanity release to verify with, e.g. 0.33.0. Pin it to the version your team reads
      with: a release that changes the parser or the questions can expire readings, and
      the gate should not move under you.
    required: true
  path:
    description: The repo to verify, relative to the workspace.
    default: "."
  model:
    description: Require this model, not merely one model (e.g. claude-sonnet-5).
    default: ""
  harness:
    description: Require this agent, not merely one agent (e.g. claude).
    default: ""
  consistent-reader:
    description: >-
      Fail unless every reading was taken by one agent and model. Set to false to allow a
      mix; the mix is still printed. Cannot be false together with model or harness.
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve the version and the runner's build
      id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        v="${VERSION#v}"
        if [ -z "$v" ]; then
          echo "::error title=sanity::the version input is required"
          exit 1
        fi
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)     target=x86_64-unknown-linux-gnu;  ext=tar.gz; exe=sanity ;;
          Linux/ARM64)   target=aarch64-unknown-linux-gnu; ext=tar.gz; exe=sanity ;;
          macOS/ARM64)   target=aarch64-apple-darwin;      ext=tar.gz; exe=sanity ;;
          Windows/X64)   target=x86_64-pc-windows-msvc;    ext=zip;    exe=sanity.exe ;;
          Windows/ARM64) target=aarch64-pc-windows-msvc;   ext=zip;    exe=sanity.exe ;;
          *)
            echo "::error title=sanity::no Sanity build for $RUNNER_OS/$RUNNER_ARCH runners"
            exit 1
            ;;
        esac
        {
          echo "version=$v"
          echo "target=$target"
          echo "ext=$ext"
          echo "dir=$RUNNER_TOOL_CACHE/sanity/$v/$target"
          echo "bin=$RUNNER_TOOL_CACHE/sanity/$v/$target/$exe"
        } >> "$GITHUB_OUTPUT"

    # About 16MB per release and target, fetched once per version rather than once per run.
    - name: Cache the binary
      uses: actions/cache@v6
      with:
        path: ${{ steps.resolve.outputs.dir }}
        key: sanity-headless-${{ steps.resolve.outputs.version }}-${{ steps.resolve.outputs.target }}

    - name: Download Sanity ${{ steps.resolve.outputs.version }}
      shell: bash
      env:
        V: ${{ steps.resolve.outputs.version }}
        TARGET: ${{ steps.resolve.outputs.target }}
        EXT: ${{ steps.resolve.outputs.ext }}
        DIR: ${{ steps.resolve.outputs.dir }}
        BIN: ${{ steps.resolve.outputs.bin }}
      run: |
        set -euo pipefail
        [ -f "$BIN" ] && exit 0
        mkdir -p "$DIR"
        # From the release on GitHub. 0.33.0 named its headless archives `sanity-<v>-<target>`;
        # every release after it says `headless`, so the release page can tell them from the
        # app's bundles. The new name is tried first.
        base="https://github.com/monsterdept/sanity/releases/download/v${V}"
        code=404
        for name in "sanity-headless-${V}-${TARGET}.${EXT}" "sanity-${V}-${TARGET}.${EXT}"; do
          archive="$RUNNER_TEMP/$name"
          code=$(curl -sSL --retry 3 -o "$archive" -w '%{http_code}' "$base/$name")
          [ "$code" = "404" ] || break
        done
        if [ "$code" = "404" ]; then
          echo "::error title=sanity::Sanity $V has no build for $TARGET. The headless builds this action runs start at 0.33.0; for an older version use monsterdept/sanity-action@v1 on a Linux x86-64 runner."
          exit 1
        fi
        [ "$code" = "200" ] || { echo "::error title=sanity::downloading $name failed with HTTP $code"; exit 1; }
        if [ "$EXT" = "zip" ]; then
          powershell -NoProfile -Command "Expand-Archive -Path '$archive' -DestinationPath '$DIR' -Force"
        else
          tar -xzf "$archive" -C "$DIR"
        fi
        rm -f "$archive"
        [ -f "$BIN" ] || { echo "::error title=sanity::$name did not contain $(basename "$BIN")"; exit 1; }

    - name: Verify readings
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BIN: ${{ steps.resolve.outputs.bin }}
        REPO: ${{ inputs.path }}
        MODEL: ${{ inputs.model }}
        HARNESS: ${{ inputs.harness }}
        CONSISTENT: ${{ inputs.consistent-reader }}
      run: |
        case "$CONSISTENT" in
          true) mixed= ;;
          false) mixed=1 ;;
          *) echo "::error title=sanity::consistent-reader must be true or false (got '$CONSISTENT')"; exit 1 ;;
        esac
        if [ ! -d "$REPO" ]; then
          echo "::error title=sanity::no directory at '$REPO' in the workspace"
          exit 1
        fi
        args=(verify "$REPO")
        [ -n "$MODEL" ] && args+=(--model "$MODEL")
        [ -n "$HARNESS" ] && args+=(--harness "$HARNESS")
        [ -n "$mixed" ] && args+=(--mixed)
        "$BIN" "${args[@]}"
